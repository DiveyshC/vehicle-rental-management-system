<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set New Password | DriveGo</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 460px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #0b2d55;
            margin-bottom: 25px;
        }

        h1 {
            text-align: center;
            color: #0b2d55;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1d2939;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #14529a;
        }

        .helptext {
            display: block;
            color: #667085;
            font-size: 13px;
            line-height: 1.5;
            margin-top: 7px;
        }

        ul.errorlist {
            color: #d92d20;
            padding-left: 20px;
        }

        .reset-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 9px;
            background: #0b2d55;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .reset-btn:hover {
            background: #14529a;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">🚘 DriveGo</div>

    {% if validlink %}

        <h1>Set New Password</h1>

        <p class="subtitle">
            Enter your new password below.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="reset-btn">
                Change Password
            </button>
        </form>

    {% else %}

        <h1>Invalid Link</h1>

        <p class="subtitle">
            This password reset link is invalid or has already been used.
            Please request a new password reset link.
        </p>

        <a href="{% url 'password_reset' %}">
            Request New Link
        </a>

    {% endif %}

</div>

</body>
</html>
