<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email | DriveGo</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 460px;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #0b2d55;
            margin-bottom: 25px;
        }

        h1 {
            color: #0b2d55;
        }

        p {
            color: #667085;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            background: #0b2d55;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">🚘 DriveGo</div>

    <h1>Check Your Email</h1>

    <p>
        If an account exists with the email address you entered,
        we've sent instructions to reset your password.
    </p>

    <a href="{% url 'login' %}">
        Back to Login
    </a>

</div>

</body>
</html>
