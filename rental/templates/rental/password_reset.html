{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | DriveGo</title>

    <link rel="stylesheet" href="{% static 'rental/css/style.css' %}">

    <style>
        .password-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
            padding: 30px;
        }

        .password-card {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
        }

        .password-logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #0b2d55;
            margin-bottom: 25px;
        }

        .password-card h1 {
            text-align: center;
            color: #0b2d55;
            margin-bottom: 10px;
        }

        .password-card p {
            text-align: center;
            color: #667085;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .password-card label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1d2939;
        }

        .password-card input[type="email"] {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 18px;
        }

        .password-card input:focus {
            outline: none;
            border-color: #14529a;
        }

        .reset-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 9px;
            background: #0b2d55;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #14529a;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0b2d55;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="password-page">

    <div class="password-card">

        <div class="password-logo">
            🚘 DriveGo
        </div>

        <h1>Forgot Password?</h1>

        <p>
            Enter your registered email address and we'll send you
            a link to reset your password.
        </p>

        <form method="post">
            {% csrf_token %}

            <label for="id_email">Email Address</label>

            {{ form.email }}

            <button type="submit" class="reset-btn">
                Send Reset Link
            </button>
        </form>

        <a href="{% url 'login' %}" class="back-login">
            ← Back to Login
        </a>

    </div>

</div>

</body>
</html>
