<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Changed | DriveGo</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 460px;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #0b2d55;
            margin-bottom: 25px;
        }

        .success-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e8f5e9;
            color: #198754;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            color: #0b2d55;
            margin-bottom: 12px;
        }

        p {
            color: #667085;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 28px;
            background: #0b2d55;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: 600;
        }

        a:hover {
            background: #14529a;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">🚘 DriveGo</div>

    <div class="success-icon">✓</div>

    <h1>Password Changed!</h1>

    <p>
        Your password has been successfully changed.
        You can now log in using your new password.
    </p>

    <a href="{% url 'login' %}">
        Login to DriveGo
    </a>

</div>

</body>
</html>
